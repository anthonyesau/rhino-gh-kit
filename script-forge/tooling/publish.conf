# Knobs for the kit's tooling/publish.sh building Script Forge — the one
# compiled component this repo ships, alongside the Claude Code plugin. Run as
# `tooling/publish.sh --repo script-forge` from the repo root (paths below are
# relative to THIS folder, script-forge/, which is that --repo target). See
# docs/ship-a-plugin/dotnet-build.md for the pipeline itself and CLAUDE.md for the
# project-specific facts (identity GUIDs, ribbon placement, the private-yak
# install route).
#
# Reminder that is NOT enforced here: this plugin is not published. `push`
# works, but the project rule is local-and-personal use only — see CLAUDE.md,
# "Publishing". `install` gives versioning and upgrades without it.

SLN="src/ScriptForge.sln"
CSPROJ="src/ScriptForge/ScriptForge.csproj"
GHA_NAME="ScriptForge.gha"

# The generated icon resources are looked up under this namespace prefix, which
# has to match <RootNamespace>.Icons in the csproj. publish.sh would derive this
# same value from GHA_NAME; kept explicit because a mismatch here compiles
# cleanly and just shows no icons.
CODEGEN_ARGS=(--resource-prefix ScriptForge.Icons)

# Rasterized to 128px as the .yak's icon.png — the Package Manager entry's icon,
# not the component's 24px canvas icon (which the build embeds as a resource).
PACKAGE_ICON_SVG="script-forge.svg"

# Tag prefix for tooling/release.sh. The tag is this plus the manifest version,
# so Script Forge 0.4.1-beta releases as forge-v0.4.1-beta. Prefixed because this
# repo versions two products independently and a bare `v0.4.1-beta` could not say
# which one it meant — the kit's own plugin version uses kit-v.
TAG_PREFIX="forge-v"

# Release title. The manifest `name:` is the *installable* spelling and cannot
# contain a space (`yak install "Script Forge"` bails), so the human name lives
# here instead of being derived from a folder or package name.
PRODUCT_NAME="Script Forge"
